replicaCount: 1

image:
  repository: ghcr.io/ozeliurs/nsrl-server
  # The chart defaults to the mutable "latest" tag, so always check the
  # registry rather than silently reusing an older cached server binary.
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 100Gi
  annotations: {}

config:
  refreshInterval: 24h
  retryInterval: 5m
  httpTimeout: 6h
  sourceURL: ""
  legacySourceURL: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# RWO storage supports one active pod. Recreate also prevents two processes from
# modifying the same database metadata during an upgrade.
strategy:
  type: Recreate

terminationGracePeriodSeconds: 30
